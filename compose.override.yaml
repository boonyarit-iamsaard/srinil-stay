services:
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: srinil-stay-server
    # Single source of values is the local dev env file; override only what must
    # differ for the prod image inside the compose network: NODE_ENV, and the
    # hosts that are reached by service name rather than localhost.
    env_file:
      - apps/server/.env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:password@postgres:5432/srinil-stay
      SMTP_HOST: mailpit
    ports:
      - "5000:5000"
    networks:
      - srinil-stay-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
