services:
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: srinil-stay-server
    # Copy apps/server/.env.production.example to
    # apps/server/.env.production.local before running `make up`.
    env_file:
      - apps/server/.env.production.local
    environment:
      NODE_ENV: production
    ports:
      - "5000:5000"
    networks:
      - srinil-stay-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
