services:
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: srinil-stay-server
    environment:
      BETTER_AUTH_SECRET: production-like-secret-key-minimum-32-chars
      BETTER_AUTH_URL: http://localhost:4000
      CORS_ORIGIN: http://localhost:3000
      DATABASE_URL: postgresql://postgres:password@postgres:5432/srinil-stay
      NODE_ENV: production
    ports:
      - "4000:4000"
    networks:
      - srinil-stay-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
