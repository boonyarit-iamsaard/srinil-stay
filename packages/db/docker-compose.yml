name: grammar-correction-tool

services:
  postgres:
    image: docker.io/postgres:18-alpine
    container_name: grammar-correction-tool-postgres
    environment:
      POSTGRES_DB: grammar-correction-tool
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    networks:
      - grammar-correction-tool-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
    name: grammar-correction-tool-pgdata

networks:
  grammar-correction-tool-network:
    name: grammar-correction-tool-network
