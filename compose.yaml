name: srinil-stay

services:
  postgres:
    image: docker.io/postgres:18-alpine
    container_name: srinil-stay-postgres
    environment:
      POSTGRES_DB: srinil-stay
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    networks:
      - srinil-stay-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
    name: srinil-stay-pgdata

networks:
  srinil-stay-network:
    name: srinil-stay-network
